<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 720">
  <defs>
    <linearGradient id="screenBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ecfdf5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a7f3d0;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="540" height="720" fill="url(#screenBg)"/>
  <!-- Barre supérieure -->
  <rect width="540" height="80" fill="#059669"/>
  <text x="270" y="50" font-size="32" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">CHARISFERME</text>
  <!-- Contenu -->
  <rect x="20" y="120" width="500" height="100" rx="10" fill="#fff" opacity="0.9" stroke="#059669" stroke-width="2"/>
  <text x="270" y="165" font-size="20" font-weight="bold" fill="#059669" text-anchor="middle" font-family="Arial, sans-serif">Produits Fermiers</text>
  <text x="270" y="200" font-size="14" fill="#047857" text-anchor="middle" font-family="Arial, sans-serif">Découvrez nos offres</text>
  <!-- Grille produits -->
  <rect x="20" y="250" width="230" height="180" rx="8" fill="#fff" opacity="0.9" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="290" y="250" width="230" height="180" rx="8" fill="#fff" opacity="0.9" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="20" y="460" width="230" height="180" rx="8" fill="#fff" opacity="0.9" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="290" y="460" width="230" height="180" rx="8" fill="#fff" opacity="0.9" stroke="#e5e7eb" stroke-width="1"/>
  <!-- Footer -->
